name: 发布版本

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: 要发布的版本号（如 v0.1.0）
        required: true
        default: v0.1.0

permissions:
  contents: write

jobs:
  windows:
    name: 构建并发布
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 安装 Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            shell-host -> target

      - name: 安装依赖
        run: npm ci

      - name: 编译壳宿主
        run: npm run sync-host

      - name: 构建安装包
        run: npm run tauri build

      - name: 生成更新说明
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.version || github.ref_name }}"
          $version = $tag -replace '^v', ''
          $lines = Get-Content README.md
          $start = ($lines | Select-String -Pattern "^### v$([regex]::Escape($version))" | Select-Object -First 1).LineNumber
          if ($start) {
            $rest = $lines[$start..($lines.Count - 1)]
            $next = ($rest | Select-String -Pattern '^## ' | Select-Object -First 1).LineNumber
            $body = if ($next) { $rest[0..($next - 2)] } else { $rest }
          } else {
            # README 不维护更新日志，按上个 tag 到本次 tag 的提交标题生成
            $prev = git describe --tags --abbrev=0 "${tag}^" 2>$null
            $skip = '^- chore\(release\)'
            if ($prev) {
              $body = @("# $tag", "") + (& git log --no-merges --pretty=format:'- %s' "$prev..$tag" | Where-Object { $_ -notmatch $skip })
            } else {
              $body = @("# $tag", "") + (& git log --no-merges --max-count=30 --pretty=format:'- %s' $tag | Where-Object { $_ -notmatch $skip })
            }
          }
          $target = Join-Path $PWD 'release-notes.md'
          [System.IO.File]::WriteAllLines($target, $body, (New-Object System.Text.UTF8Encoding($false)))

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: ${{ github.event.inputs.version || github.ref_name }}
          body_path: release-notes.md
          fail_on_unmatched_files: false
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
