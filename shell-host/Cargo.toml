[package]
name = "shell-host"
version = "0.1.0"
edition = "2021"
description = "JianLing generated Windows web app host"

[dependencies]
tao = "0.34"
wry = "0.53"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9.7.0", default-features = false, features = ["deflate"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
webpki-roots = "0.26"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
